<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NOVEL｜AI × 人間 × 物語</title>

<meta name="description" content="AIと人間が一緒に作る小説メディア。SF、恋愛、ホラー、異世界、ミステリーなどの物語を掲載しています。">

<style>
/* =========================
   基本設定
========================= */

:root {
    --bg: #0b0d12;
    --bg2: #12151d;
    --card: #171b24;
    --card2: #1d2230;
    --text: #f3f5f7;
    --sub: #aeb5c2;
    --line: #292f3d;
    --accent: #8b7cff;
    --accent2: #b09cff;
    --danger: #ff6685;
    --max: 1100px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top left, rgba(139,124,255,0.12), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
    line-height: 1.8;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input {
    font: inherit;
}

/* =========================
   ヘッダー
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11, 13, 18, 0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
}

.header-inner {
    max-width: var(--max);
    margin: auto;
    min-height: 70px;
    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: var(--accent2);
}

nav {
    display: flex;
    gap: 18px;
    color: var(--sub);
    font-size: 14px;
}

nav a:hover {
    color: var(--text);
}

/* =========================
   メイン
========================= */

main {
    max-width: var(--max);
    margin: auto;
    padding: 40px 20px 80px;
}

.hero {
    min-height: 390px;
    padding: 65px 35px;
    border: 1px solid var(--line);
    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(139,124,255,0.20),
            rgba(18,21,29,0.95) 55%
        );

    display: flex;
    align-items: center;
}

.hero-content {
    max-width: 700px;
}

.hero-label {
    display: inline-block;
    padding: 5px 12px;
    margin-bottom: 18px;

    border: 1px solid rgba(176,156,255,0.35);
    border-radius: 999px;

    color: var(--accent2);
    font-size: 13px;
}

.hero h1 {
    margin: 0 0 18px;
    font-size: clamp(38px, 7vw, 72px);
    line-height: 1.05;
}

.hero h1 span {
    color: var(--accent2);
}

.hero p {
    margin: 0 0 25px;
    color: var(--sub);
    font-size: 17px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 11px 20px;

    border-radius: 999px;
    border: 1px solid transparent;

    background: var(--accent);
    color: white;

    font-weight: 700;
    cursor: pointer;

    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-2px);
    background: var(--accent2);
}

.btn.secondary {
    background: transparent;
    border-color: var(--line);
    color: var(--text);
}

/* =========================
   セクション
========================= */

.section {
    margin-top: 55px;
}

.section-title {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 15px;

    margin-bottom: 20px;
}

.section-title h2 {
    margin: 0;
    font-size: 25px;
}

.section-title p {
    margin: 0;
    color: var(--sub);
    font-size: 13px;
}

/* =========================
   作品カード
========================= */

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.card {
    background: linear-gradient(
        160deg,
        var(--card2),
        var(--card)
    );

    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;

    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: rgba(176,156,255,0.5);
}

.cover {
    height: 175px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(176,156,255,0.35),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #181b29,
            #0e1017
        );

    font-size: 25px;
    font-weight: 900;
    text-align: center;
}

.card-body {
    padding: 18px;
}

.card h3 {
    margin: 0 0 8px;
    font-size: 19px;
}

.card p {
    margin: 0 0 13px;
    color: var(--sub);
    font-size: 13px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 15px;
}

.tag {
    padding: 3px 9px;

    border: 1px solid var(--line);
    border-radius: 999px;

    color: var(--sub);
    font-size: 11px;
}

/* =========================
   ジャンル
========================= */

.genre-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.genre {
    padding: 16px 10px;

    text-align: center;

    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;

    color: var(--sub);

    cursor: pointer;
    transition: 0.2s;
}

.genre:hover {
    color: white;
    border-color: var(--accent);
}

/* =========================
   広告スペース
========================= */

.ad-space {
    min-height: 120px;

    margin: 45px 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px dashed #3b4150;
    border-radius: 15px;

    color: #687080;
    font-size: 13px;
}

/* =========================
   検索
========================= */

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search-box input {
    width: 100%;
    padding: 13px 16px;

    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;

    color: white;
    outline: none;
}

.search-box input:focus {
    border-color: var(--accent);
}

/* =========================
   作品ページ
========================= */

.story-page {
    max-width: 850px;
    margin: auto;
}

.story-header {
    margin-bottom: 35px;
}

.story-header .tag {
    display: inline-block;
}

.story-header h1 {
    margin: 15px 0 10px;
    font-size: clamp(30px, 6vw, 52px);
    line-height: 1.25;
}

.story-description {
    color: var(--sub);
}

.story-meta {
    color: var(--sub);
    font-size: 13px;
}

.episode-list {
    display: grid;
    gap: 10px;
}

.episode {
    padding: 17px 20px;

    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.episode:hover {
    border-color: var(--accent);
}

.episode small {
    color: var(--sub);
}

/* =========================
   本文
========================= */

.chapter {
    max-width: 780px;
    margin: auto;
}

.chapter-header {
    margin-bottom: 45px;
}

.chapter-header h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.35;
}

.chapter-header p {
    color: var(--sub);
}

.chapter-body {
    font-family:
        "Noto Serif JP",
        "Yu Mincho",
        serif;

    font-size: 18px;
    line-height: 2.2;
}

.chapter-body p {
    margin: 0 0 28px;
}

.chapter-nav {
    margin-top: 55px;

    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.chapter-nav .btn {
    flex: 1;
}

/* =========================
   フッター
========================= */

footer {
    margin-top: 80px;
    padding: 40px 20px;

    border-top: 1px solid var(--line);

    color: var(--sub);
    text-align: center;

    font-size: 13px;
}

.footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    margin-bottom: 15px;
}

/* =========================
   非表示
========================= */

.hidden {
    display: none !important;
}

/* =========================
   スマホ
